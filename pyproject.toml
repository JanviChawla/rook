[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rook"
dynamic = ["version"]
description = "A local, keyboard-first terminal daily journal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Janvi Chawla" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/JanviChawla/rook"

[project.scripts]
rook = "rook.__main__:main"

[tool.hatch.version]
path = "src/rook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
